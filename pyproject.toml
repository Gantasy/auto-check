[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codecheck-shield"
version = "1.0.0"
description = "Batch ignore CodeCheck defects from spreadsheets through Windows desktop automation or optional browser automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["codecheck", "automation", "windows", "desktop", "chrome", "batch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
automation = [
    "playwright>=1.52,<2",
    "pyautogui>=0.9.54,<1",
    "pyperclip>=1.9,<2",
]

[project.scripts]
codecheck-shield = "codecheck_shield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
