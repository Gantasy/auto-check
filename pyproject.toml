[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecheck-shield"
version = "1.0.0"
description = "Batch ignore CodeCheck defects from spreadsheets through a Chrome automation flow"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
keywords = ["codecheck", "playwright", "automation", "chrome", "batch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
automation = ["playwright>=1.52,<2"]

[project.scripts]
codecheck-shield = "codecheck_shield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
